[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aes-volleyball"
version = "0.1.0"
description = "Tools for collecting and analyzing AES volleyball data"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]